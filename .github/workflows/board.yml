name: Board

# Move os cards do Scrumban conforme issues e PRs.
# Precisa do secret PROJECT_TOKEN (PAT com escopo "project"); o GITHUB_TOKEN
# não enxerga Projects de usuário. Sem o secret, o job só avisa e sai.
on:
  issues:
    types: [opened, reopened, closed]
  pull_request:
    types: [opened, reopened, ready_for_review, closed]

permissions:
  contents: read

env:
  PROJECT_ID: PVT_kwHOB5AmNs4Bknuf
  STATUS_FIELD: PVTSSF_lAHOB5AmNs4BknufzhjXr_s
  BACKLOG: ffb6aa46
  IN_REVIEW: d41637e7
  DONE: cf8f507a

jobs:
  mover:
    name: Mover cards
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar coluna
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ISSUE_ID: ${{ github.event.issue.node_id }}
          PR_ID: ${{ github.event.pull_request.node_id }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::PROJECT_TOKEN ausente — board não atualizado."
            exit 0
          fi

          # GraphQL direto pelo ID do projeto: `gh project --owner` resolve o dono
          # e exigiria o escopo read:org, que o PROJECT_TOKEN não tem.
          set_status() { # content-node-id, option-id
            local item
            item=$(gh api graphql -f query='mutation($p:ID!,$c:ID!){addProjectV2ItemById(input:{projectId:$p,contentId:$c}){item{id}}}' \
              -f p="$PROJECT_ID" -f c="$1" --jq .data.addProjectV2ItemById.item.id)
            gh api graphql -f query='mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$o}}){projectV2Item{id}}}' \
              -f p="$PROJECT_ID" -f i="$item" -f f="$STATUS_FIELD" -f o="$2" > /dev/null
          }

          # Issues fechadas por "Closes #N" no corpo do PR (node ids)
          linked_issues() {
            printf '%s' "$PR_BODY" \
              | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' \
              | grep -oE '[0-9]+' | sort -u \
              | while read -r n; do gh api "repos/$REPO/issues/$n" --jq .node_id; done
          }

          if [ "$EVENT" = "issues" ]; then
            case "$ACTION" in
              opened|reopened) set_status "$ISSUE_ID" "$BACKLOG" ;;
              closed)          set_status "$ISSUE_ID" "$DONE" ;;
            esac
          else
            case "$ACTION" in
              opened|reopened|ready_for_review)
                set_status "$PR_ID" "$IN_REVIEW"
                for u in $(linked_issues); do set_status "$u" "$IN_REVIEW"; done ;;
              closed)
                set_status "$PR_ID" "$DONE"
                if [ "$PR_MERGED" = "true" ]; then
                  for u in $(linked_issues); do set_status "$u" "$DONE"; done
                fi ;;
            esac
          fi
